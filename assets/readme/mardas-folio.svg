<svg xmlns="http://www.w3.org/2000/svg" width="1916" height="821" viewBox="0 0 1916 821">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161616"/>
      <stop offset="0.55" stop-color="#121212"/>
      <stop offset="1" stop-color="#0d0d0d"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f97316" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0 H0 V48" fill="none" stroke="#ffffff" stroke-opacity="0.022" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1916" height="821" fill="url(#bg)"/>
  <rect width="1916" height="821" fill="url(#grid)"/>
  <rect x="0" y="0" width="1916" height="3" fill="url(#rule)"/>

  <!-- ── Left: identity ───────────────────────────────────────────── -->
  <g transform="translate(128 150)">
    <!-- Folio mark, the same glyph the desktop application ships as its icon -->
    <g>
      <rect width="104" height="104" rx="23" fill="#1c1c1c" stroke="#2a2a2a" stroke-width="1"/>
      <g transform="translate(52 52) scale(0.5525)" fill="#f97316">
        <g transform="rotate(0) translate(14 -60)"><path d="M0 0 H40 V14 H14 V20 H30 V34 H14 V50 H0 Z"/></g>
        <g transform="rotate(90) translate(14 -60)"><path d="M0 0 H40 V14 H14 V20 H30 V34 H14 V50 H0 Z"/></g>
        <g transform="rotate(180) translate(14 -60)"><path d="M0 0 H40 V14 H14 V20 H30 V34 H14 V50 H0 Z"/></g>
        <g transform="rotate(270) translate(14 -60)"><path d="M0 0 H40 V14 H14 V20 H30 V34 H14 V50 H0 Z"/></g>
      </g>
    </g>

    <text x="132" y="52" font-family="Inter Display, Inter, DejaVu Sans, sans-serif"
          font-size="30" font-weight="500" letter-spacing="7" fill="#6f6f6f">MARKDOWN</text>
    <text x="132" y="92" font-family="Inter Display, Inter, DejaVu Sans, sans-serif"
          font-size="30" font-weight="500" letter-spacing="7" fill="#6f6f6f">PUBLISHING</text>
  </g>

  <g transform="translate(128 330)">
    <text font-family="Inter Display, Inter, DejaVu Sans, sans-serif" font-size="112" font-weight="700">
      <tspan fill="#f4f4f4">Mardas</tspan><tspan dx="26" fill="#f97316">Folio</tspan>
    </text>

    <text y="78" font-family="Inter, DejaVu Sans, sans-serif" font-size="38" font-weight="400" fill="#b4b4b4">
      Desktop authoring and PDF publishing
    </text>
    <text y="130" font-family="Inter, DejaVu Sans, sans-serif" font-size="32" font-weight="400" fill="#7d7d7d">
      Persian, English, and mixed RTL / LTR technical documents
    </text>
  </g>

  <!-- Capability chips -->
  <g transform="translate(128 617)" font-family="Inter, DejaVu Sans, sans-serif" font-size="25" font-weight="500">
    <g>
      <rect width="158" height="52" rx="7" fill="#191919" stroke="#2d2d2d"/>
      <text x="79" y="34" text-anchor="middle" fill="#c6c6c6">RTL / LTR</text>
    </g>
    <g transform="translate(174 0)">
      <rect width="176" height="52" rx="7" fill="#191919" stroke="#2d2d2d"/>
      <text x="88" y="34" text-anchor="middle" fill="#c6c6c6">Typography</text>
    </g>
    <g transform="translate(366 0)">
      <rect width="196" height="52" rx="7" fill="#191919" stroke="#2d2d2d"/>
      <text x="98" y="34" text-anchor="middle" fill="#c6c6c6">Math &amp; Code</text>
    </g>
    <g transform="translate(578 0)">
      <rect width="164" height="52" rx="7" fill="#191919" stroke="#2d2d2d"/>
      <text x="82" y="34" text-anchor="middle" fill="#c6c6c6">Diagrams</text>
    </g>
    <g transform="translate(758 0)">
      <rect width="164" height="52" rx="7" fill="#191919" stroke="#2d2d2d"/>
      <text x="82" y="34" text-anchor="middle" fill="#c6c6c6">Citations</text>
    </g>
  </g>

  <!-- ── Right: Markdown becomes a printed page ───────────────────── -->
  <g transform="translate(1148 216)">

    <!-- Source panel -->
    <g>
      <rect width="286" height="392" rx="12" fill="#181818" stroke="#2c2c2c"/>
      <rect x="1" y="1" width="284" height="42" rx="11" fill="#1f1f1f"/>
      <circle cx="26" cy="22" r="5" fill="#3a3a3a"/>
      <circle cx="44" cy="22" r="5" fill="#3a3a3a"/>
      <circle cx="62" cy="22" r="5" fill="#3a3a3a"/>
      <text x="90" y="28" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#6b6b6b">document.md</text>

      <g font-family="DejaVu Sans Mono, monospace" font-size="19">
        <text x="26" y="86" fill="#f97316"># عنوان</text>
        <rect x="26" y="106" width="180" height="9" rx="4" fill="#333333"/>
        <rect x="26" y="127" width="228" height="9" rx="4" fill="#333333"/>
        <rect x="26" y="148" width="146" height="9" rx="4" fill="#333333"/>

        <text x="26" y="196" fill="#f97316">## Section</text>
        <rect x="26" y="216" width="206" height="9" rx="4" fill="#333333"/>
        <rect x="26" y="237" width="164" height="9" rx="4" fill="#333333"/>
      </g>

      <rect x="26" y="266" width="234" height="96" rx="8" fill="#141414" stroke="#2a2a2a"/>
      <text x="40" y="292" font-family="DejaVu Sans Mono, monospace" font-size="16" fill="#5f5f5f">```python</text>
      <rect x="40" y="306" width="120" height="8" rx="4" fill="#f97316" fill-opacity="0.55"/>
      <rect x="40" y="324" width="176" height="8" rx="4" fill="#333333"/>
      <rect x="40" y="342" width="96" height="8" rx="4" fill="#333333"/>
    </g>

    <!-- Transform -->
    <g transform="translate(310 196)">
      <line x1="0" y1="0" x2="86" y2="0" stroke="#3a3a3a" stroke-width="2"/>
      <path d="M86 -8 L104 0 L86 8 Z" fill="#f97316"/>
      <text x="52" y="-22" text-anchor="middle" font-family="Inter, DejaVu Sans, sans-serif"
            font-size="19" font-weight="500" fill="#6f6f6f">Chromium</text>
    </g>

    <!-- Printed page -->
    <g transform="translate(444 -22)">
      <rect x="14" y="14" width="286" height="436" rx="10" fill="#0f0f0f" stroke="#242424"/>
      <rect width="286" height="436" rx="10" fill="#fbfbfa" stroke="#e2e2e0"/>

      <rect x="34" y="40" width="120" height="10" rx="5" fill="#f97316"/>
      <rect x="34" y="70" width="196" height="18" rx="6" fill="#1d1d1d"/>
      <rect x="34" y="100" width="150" height="10" rx="5" fill="#b9b9b6"/>

      <rect x="34" y="146" width="218" height="7" rx="3.5" fill="#cfcfcc"/>
      <rect x="34" y="164" width="200" height="7" rx="3.5" fill="#cfcfcc"/>
      <rect x="34" y="182" width="212" height="7" rx="3.5" fill="#cfcfcc"/>
      <rect x="34" y="200" width="120" height="7" rx="3.5" fill="#cfcfcc"/>

      <rect x="34" y="228" width="218" height="72" rx="6" fill="#f3f3f1" stroke="#e4e4e1"/>
      <rect x="46" y="244" width="86" height="7" rx="3.5" fill="#f97316" fill-opacity="0.8"/>
      <rect x="46" y="262" width="150" height="7" rx="3.5" fill="#c6c6c3"/>
      <rect x="46" y="280" width="112" height="7" rx="3.5" fill="#c6c6c3"/>

      <rect x="34" y="322" width="218" height="7" rx="3.5" fill="#cfcfcc"/>
      <rect x="34" y="340" width="186" height="7" rx="3.5" fill="#cfcfcc"/>
      <rect x="34" y="358" width="206" height="7" rx="3.5" fill="#cfcfcc"/>

      <line x1="34" y1="396" x2="252" y2="396" stroke="#e4e4e1" stroke-width="1"/>
      <text x="252" y="416" text-anchor="end" font-family="Inter, DejaVu Sans, sans-serif"
            font-size="15" fill="#a3a3a0">PDF</text>
    </g>
  </g>
</svg>
