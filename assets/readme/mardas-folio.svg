<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <!--
    Repository banner, 1200 x 400.

    Paper ground, ink wordmark, one terracotta blob bleeding off the lower
    left. The pipeline line stays because it is the product's whole promise:
    Markdown in, a Chromium-rendered PDF out, and nothing in between that
    needs installing.

    Rules from the identity, kept here so the next edit keeps them:
      - the mark's tile sits on ink or paper, never on terracotta at this size
      - blobs are cut by the frame; they never float fully inside it
      - no screenshots; the product's own preview does that job in the README
  -->
  <defs>
    <clipPath id="frame"><rect width="1200" height="400" rx="0"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="400" fill="#f5ead8"/>

    <!-- The blob, cut by the lower-left corner. -->
    <circle cx="40" cy="392" r="196" fill="#c67139" opacity="0.14"/>
    <circle cx="1168" cy="24" r="120" fill="#7a8a5e" opacity="0.12"/>

    <!-- Mark: the ink tile with the four-fold F, as packaged. -->
    <g transform="translate(72 88)">
      <rect width="96" height="96" rx="21" fill="#2e2b25"/>
      <g transform="translate(48 48) scale(0.51)" fill="#c67139">
        <g transform="rotate(0) translate(14 -60)"><path d="M0 0 H40 V14 H14 V20 H30 V34 H14 V50 H0 Z"/></g>
        <g transform="rotate(90) translate(14 -60)"><path d="M0 0 H40 V14 H14 V20 H30 V34 H14 V50 H0 Z"/></g>
        <g transform="rotate(180) translate(14 -60)"><path d="M0 0 H40 V14 H14 V20 H30 V34 H14 V50 H0 Z"/></g>
        <g transform="rotate(270) translate(14 -60)"><path d="M0 0 H40 V14 H14 V20 H30 V34 H14 V50 H0 Z"/></g>
      </g>
    </g>

    <!-- Wordmark and version -->
    <text x="196" y="140" font-family="Figtree, 'DejaVu Sans', system-ui, sans-serif"
          font-size="60" font-weight="700" letter-spacing="-1.6">
      <tspan fill="#201e1d">Mardas</tspan><tspan dx="14" fill="#c67139">Folio</tspan>
    </text>
    <text x="196" y="172" font-family="'IBM Plex Mono', 'DejaVu Sans Mono', monospace"
          font-size="15" fill="#645c50" letter-spacing="0.06em">v2.0.3 · MIT</text>

    <!-- Tagline -->
    <text x="72" y="248" font-family="Figtree, 'DejaVu Sans', system-ui, sans-serif"
          font-size="21" fill="#474238">Markdown authoring and PDF publishing for Persian, English,</text>
    <text x="72" y="278" font-family="Figtree, 'DejaVu Sans', system-ui, sans-serif"
          font-size="21" fill="#474238">and mixed RTL / LTR technical documents.</text>

    <!-- The pipeline: the product's whole promise, on ink. -->
    <g transform="translate(72 312)">
      <rect width="612" height="44" rx="22" fill="#2e2b25"/>
      <text x="24" y="29" font-family="'IBM Plex Mono', 'DejaVu Sans Mono', monospace"
            font-size="15" fill="#f5ead8" letter-spacing="0.02em">Markdown</text>
      <text x="130" y="29" font-family="'IBM Plex Mono', 'DejaVu Sans Mono', monospace"
            font-size="15" fill="#c0b6a5">&#8594;</text>
      <text x="158" y="29" font-family="'IBM Plex Mono', 'DejaVu Sans Mono', monospace"
            font-size="15" fill="#f5ead8" letter-spacing="0.02em">Structured HTML</text>
      <text x="344" y="29" font-family="'IBM Plex Mono', 'DejaVu Sans Mono', monospace"
            font-size="15" fill="#c0b6a5">&#8594;</text>
      <text x="372" y="29" font-family="'IBM Plex Mono', 'DejaVu Sans Mono', monospace"
            font-size="15" fill="#f6a06b" letter-spacing="0.02em">Chromium PDF</text>
    </g>

    <!-- Capability chips -->
    <g font-family="Figtree, 'DejaVu Sans', system-ui, sans-serif" font-size="15" font-weight="600">
      <g transform="translate(716 312)">
        <rect width="150" height="44" rx="22" fill="#ffe1d0"/>
        <text x="75" y="29" text-anchor="middle" fill="#643312">Bidirectional</text>
      </g>
      <g transform="translate(880 312)">
        <rect width="112" height="44" rx="22" fill="#e1eecc"/>
        <text x="56" y="29" text-anchor="middle" fill="#3d472b">Offline</text>
      </g>
      <g transform="translate(1006 312)">
        <rect width="122" height="44" rx="22" fill="#eee7db"/>
        <text x="61" y="29" text-anchor="middle" fill="#474238">No LaTeX</text>
      </g>
    </g>

    <!-- The repository path: the only place the URL appears in the identity. -->
    <text x="1128" y="140" text-anchor="end"
          font-family="'IBM Plex Mono', 'DejaVu Sans Mono', monospace"
          font-size="14" fill="#82796a">github.com/mragetsars/Mardas-Folio</text>
  </g>
</svg>
