name: Release Artifacts

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-core:
    name: Build verified core artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 70
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install package and Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m playwright install --with-deps chromium

      - name: Resolve release metadata
        id: metadata
        shell: bash
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Run complete release gate
        env:
          MARDAS_RENDER_SMOKE: '1'
          MARDAS_RELEASE_VISUAL_QA: '1'
        run: ./scripts/release_gate.sh

      - name: Assemble core release directory
        shell: bash
        run: |
          rm -rf build/release-core
          mkdir -p build/release-core
          cp dist/*.whl dist/*.tar.gz dist/*.spdx.json build/release-core/
          cp examples/GUIDE.en.pdf examples/GUIDE.fa.pdf build/release-core/
          python scripts/finalize_release_artifacts.py \
            --artifact-dir build/release-core \
            --version "${{ steps.metadata.outputs.version }}" \
            --source-revision "$GITHUB_SHA" \
            --require-sbom

      - name: Upload core release files
        uses: actions/upload-artifact@v7
        with:
          name: release-core
          path: build/release-core/
          if-no-files-found: error
          retention-days: 30

  offline-bundles:
    name: Offline Python bundle / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    needs: build-core
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Download core artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-core
          path: build/release-core

      - name: Build offline wheel bundle
        run: |
          python scripts/build_offline_bundle.py --wheel-dir build/release-core --output-dir build/offline --platform-label "${{ runner.os }}-${{ runner.arch }}"

      - name: Upload offline bundle
        uses: actions/upload-artifact@v7
        with:
          name: offline-${{ runner.os }}-${{ runner.arch }}
          path: build/offline/*.zip
          if-no-files-found: error
          retention-days: 30

  standalone-runtime:
    name: Standalone Windows runtime
    runs-on: windows-latest
    timeout-minutes: 50
    needs: build-core
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install desktop build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[desktop]"

      - name: Install pinned Chromium headless shell
        run: python -m playwright install chromium --only-shell

      - name: Build portable standalone runtime
        run: python scripts/build_standalone_runtime.py --clean

      - name: Verify frozen runtime and Unicode rendering
        shell: pwsh
        run: |
          $runtime = Get-ChildItem build/standalone-runtime -Directory -Filter 'Mardas-MD2PDF-*-runtime-*' | Select-Object -First 1
          if (-not $runtime) { throw 'Standalone runtime directory was not created.' }
          python scripts/verify_standalone_runtime.py $runtime.FullName --render

      - name: Upload standalone runtime
        uses: actions/upload-artifact@v7
        with:
          name: standalone-runtime
          path: build/standalone-runtime/*.zip
          if-no-files-found: error
          retention-days: 30

  desktop-installer:
    name: Native Windows desktop installer
    runs-on: windows-latest
    timeout-minutes: 80
    needs: [build-core, standalone-runtime]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Download standalone runtime
        uses: actions/download-artifact@v8
        with:
          name: standalone-runtime
          path: build/runtime-download

      - name: Extract standalone runtime
        shell: pwsh
        run: |
          $zip = Get-ChildItem build/runtime-download -File -Filter '*.zip' | Select-Object -First 1
          if (-not $zip) { throw 'Standalone runtime archive was not downloaded.' }
          New-Item -ItemType Directory -Force build/runtime-extracted | Out-Null
          Expand-Archive -Path $zip.FullName -DestinationPath build/runtime-extracted -Force
          $runtime = Get-ChildItem build/runtime-extracted -Directory -Filter 'Mardas-MD2PDF-*-runtime-*' | Select-Object -First 1
          if (-not $runtime) { throw 'Standalone runtime directory was not found after extraction.' }
          "RUNTIME_DIR=$($runtime.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install desktop build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[desktop]"
          cargo install tauri-cli --version 2.11.4 --locked

      - name: Build and verify native installer
        shell: pwsh
        run: |
          python scripts/build_desktop_app.py --runtime "$env:RUNTIME_DIR" --clean
          $installer = Get-ChildItem build/desktop -File -Filter 'Mardas-Studio-*-setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Desktop installer was not created.' }
          python scripts/verify_desktop_installer.py $installer.FullName --version "${{ needs.build-core.outputs.version }}"

      - name: Upload native desktop installer
        uses: actions/upload-artifact@v7
        with:
          name: desktop-installer
          path: build/desktop/Mardas-Studio-*-setup.exe
          if-no-files-found: error
          retention-days: 30

  attest:
    name: Finalize and attest release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build-core, offline-bundles, standalone-runtime, desktop-installer]
    if: github.repository == 'mragetsars/Mardas-MD2PDF'
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install release tooling dependencies
        run: python -m pip install --upgrade packaging

      - name: Download core artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-core
          path: build/release

      - name: Download offline bundles
        uses: actions/download-artifact@v8
        with:
          pattern: offline-*
          path: build/offline
          merge-multiple: true

      - name: Download standalone runtime
        uses: actions/download-artifact@v8
        with:
          name: standalone-runtime
          path: build/standalone

      - name: Download native desktop installer
        uses: actions/download-artifact@v8
        with:
          name: desktop-installer
          path: build/desktop

      - name: Finalize release manifest and checksums
        shell: bash
        run: |
          cp build/offline/*.zip build/release/
          cp build/standalone/*.zip build/release/
          cp build/desktop/*-setup.exe build/release/
          python scripts/finalize_release_artifacts.py \
            --artifact-dir build/release \
            --version "${{ needs.build-core.outputs.version }}" \
            --source-revision "$GITHUB_SHA" \
            --require-sbom \
            --minimum-bundle-count 3 \
            --minimum-standalone-runtime-count 1 \
            --minimum-desktop-installer-count 1
          python - <<'PY'
          from pathlib import Path
          source = Path("build/release/CHECKSUMS.sha256")
          selected = []
          for line in source.read_text(encoding="utf-8").splitlines():
              if not line:
                  continue
              name = line.split("  ", 1)[1]
              if name.endswith(".spdx.json") or name == "RELEASE-MANIFEST.json":
                  continue
              selected.append(line)
          Path("build/attestation-subjects.sha256").write_text(
              "\n".join(selected) + "\n", encoding="utf-8", newline="\n"
          )
          PY

      - name: Resolve SBOM path
        id: paths
        shell: bash
        run: |
          sbom="$(find build/release -maxdepth 1 -type f -name '*.spdx.json' -print -quit)"
          test -n "$sbom"
          echo "sbom=$sbom" >> "$GITHUB_OUTPUT"

      - name: Attest SLSA build provenance
        id: provenance
        uses: actions/attest@v4
        with:
          subject-checksums: build/attestation-subjects.sha256

      - name: Attest SPDX SBOM
        id: sbom
        uses: actions/attest@v4
        with:
          subject-checksums: build/attestation-subjects.sha256
          sbom-path: ${{ steps.paths.outputs.sbom }}

      - name: Preserve signed attestation bundles
        shell: bash
        run: |
          mkdir -p build/attestations
          cp "${{ steps.provenance.outputs.bundle-path }}" build/attestations/provenance.sigstore.json
          cp "${{ steps.sbom.outputs.bundle-path }}" build/attestations/sbom.sigstore.json
          (
            cd build/attestations
            sha256sum provenance.sigstore.json sbom.sigstore.json > CHECKSUMS.sha256
          )

      - name: Upload final release package
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ needs.build-core.outputs.version }}
          path: build/release/
          if-no-files-found: error
          retention-days: 90

      - name: Upload signed attestation bundles
        uses: actions/upload-artifact@v7
        with:
          name: release-attestations-${{ needs.build-core.outputs.version }}
          path: build/attestations/
          if-no-files-found: error
          retention-days: 90
