name: Release Artifacts

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-preflight:
    name: Verify signed draft release prerequisites
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Verify updater signing configuration
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          MARDAS_UPDATER_PUBKEY: ${{ vars.MARDAS_UPDATER_PUBKEY }}
        run: python scripts/release_preflight.py --mode draft --json build/release-preflight.json

  build-core:
    name: Build verified core artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 70
    needs: release-preflight
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install package and Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m playwright install --with-deps chromium

      - name: Resolve release metadata
        id: metadata
        shell: bash
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Run complete release gate
        env:
          MARDAS_RENDER_SMOKE: '1'
          MARDAS_RELEASE_VISUAL_QA: '1'
          MARDAS_RELEASE_DESKTOP_UI: '1'
        run: ./scripts/release_gate.sh

      - name: Assemble core release directory
        shell: bash
        run: |
          rm -rf build/release-core
          mkdir -p build/release-core
          cp dist/*.whl dist/*.tar.gz dist/*.spdx.json build/release-core/
          cp examples/GUIDE.en.pdf examples/GUIDE.fa.pdf build/release-core/
          python scripts/finalize_release_artifacts.py \
            --artifact-dir build/release-core \
            --version "${{ steps.metadata.outputs.version }}" \
            --source-revision "$GITHUB_SHA" \
            --require-sbom

      - name: Upload core release files
        uses: actions/upload-artifact@v7
        with:
          name: release-core
          path: build/release-core/
          if-no-files-found: error
          retention-days: 30

  offline-bundles:
    name: Offline Python bundle / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    needs: build-core
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Download core artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-core
          path: build/release-core

      - name: Build offline wheel bundle
        run: |
          python scripts/build_offline_bundle.py --wheel-dir build/release-core --output-dir build/offline --platform-label "${{ runner.os }}-${{ runner.arch }}"

      - name: Upload offline bundle
        uses: actions/upload-artifact@v7
        with:
          name: offline-${{ runner.os }}-${{ runner.arch }}
          path: build/offline/*.zip
          if-no-files-found: error
          retention-days: 30

  standalone-runtime:
    name: Standalone Windows runtime
    runs-on: windows-latest
    timeout-minutes: 50
    needs: build-core
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install desktop build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[desktop]"

      - name: Install pinned Chromium headless shell
        run: python -m playwright install chromium --only-shell

      - name: Build portable standalone runtime
        run: python scripts/build_standalone_runtime.py --clean

      - name: Verify frozen runtime and Unicode rendering
        shell: pwsh
        run: |
          $runtime = Get-ChildItem build/standalone-runtime -Directory -Filter 'Mardas-MD2PDF-*-runtime-*' | Select-Object -First 1
          if (-not $runtime) { throw 'Standalone runtime directory was not created.' }
          python scripts/verify_standalone_runtime.py $runtime.FullName --render

      - name: Upload standalone runtime
        uses: actions/upload-artifact@v7
        with:
          name: standalone-runtime
          path: build/standalone-runtime/*.zip
          if-no-files-found: error
          retention-days: 30

  desktop-installer:
    name: Native Windows desktop packages
    runs-on: windows-latest
    timeout-minutes: 90
    needs: [build-core, standalone-runtime]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Download verified standalone runtime
        uses: actions/download-artifact@v8
        with:
          name: standalone-runtime
          path: build/runtime-download

      - name: Extract standalone runtime
        shell: pwsh
        run: |
          $zip = Get-ChildItem build/runtime-download -File -Filter '*.zip' | Select-Object -First 1
          if (-not $zip) { throw 'Standalone runtime archive was not downloaded.' }
          New-Item -ItemType Directory -Force build/runtime-extracted | Out-Null
          Expand-Archive -Path $zip.FullName -DestinationPath build/runtime-extracted -Force
          $runtime = Get-ChildItem build/runtime-extracted -Directory -Filter 'Mardas-MD2PDF-*-runtime-*' | Select-Object -First 1
          if (-not $runtime) { throw 'Standalone runtime directory was not found after extraction.' }
          "RUNTIME_DIR=$($runtime.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install desktop build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[desktop]"
          cargo install tauri-cli --version 2.11.4 --locked

      - name: Build Windows setup, portable package, and signed updater
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          MARDAS_UPDATER_PUBKEY: ${{ vars.MARDAS_UPDATER_PUBKEY }}
          MARDAS_UPDATE_ENDPOINT: https://github.com/mragetsars/Mardas-MD2PDF/releases/latest/download/latest.json
        run: |
          python scripts/build_native_desktop.py `
            --runtime "$env:RUNTIME_DIR" `
            --create-updater-artifacts `
            --updater-endpoint "$env:MARDAS_UPDATE_ENDPOINT" `
            --clean

      - name: Verify Windows native artifacts
        shell: pwsh
        run: |
          $version = "${{ needs.build-core.outputs.version }}"
          $files = Get-ChildItem build/desktop-native -File | Where-Object {
            $_.Name -like 'Mardas-Studio-*-setup.exe' -or
            $_.Name -like 'Mardas-Studio-*-setup.exe.sig' -or
            $_.Name -like 'Mardas-Studio-*-portable.zip'
          }
          if ($files.Count -lt 3) { throw 'Expected Windows setup, updater signature, and portable artifacts.' }
          foreach ($file in $files) {
            python scripts/verify_native_desktop.py $file.FullName --version $version
          }

      - name: Upload Windows native packages
        uses: actions/upload-artifact@v7
        with:
          name: desktop-native-windows
          path: |
            build/desktop-native/Mardas-Studio-*-setup.exe
            build/desktop-native/Mardas-Studio-*-setup.exe.sig
            build/desktop-native/Mardas-Studio-*-portable.zip
            build/desktop-native/desktop-native-manifest.json
          if-no-files-found: error
          retention-days: 30

  unix-desktop-packages:
    name: Native desktop / ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 100
    needs: build-core
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            label: Linux-X64
            linux: true
          - runner: macos-15
            label: macOS-ARM64
            linux: false
          - runner: macos-15-intel
            label: macOS-X64
            linux: false
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux desktop prerequisites
        if: matrix.linux
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install desktop build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[desktop]"
          cargo install tauri-cli --version 2.11.4 --locked

      - name: Install Chromium headless shell on Linux
        if: matrix.linux
        run: python -m playwright install --with-deps chromium --only-shell

      - name: Install Chromium headless shell on macOS
        if: ${{ !matrix.linux }}
        run: python -m playwright install chromium --only-shell

      - name: Build and verify standalone runtime
        shell: bash
        run: |
          python scripts/build_standalone_runtime.py --clean
          runtime="$(find build/standalone-runtime -maxdepth 1 -type d -name 'Mardas-MD2PDF-*-runtime-*' -print -quit)"
          test -n "$runtime"
          python scripts/verify_standalone_runtime.py "$runtime" --render
          echo "RUNTIME_DIR=$runtime" >> "$GITHUB_ENV"

      - name: Build native packages and signed updater artifacts
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          MARDAS_UPDATER_PUBKEY: ${{ vars.MARDAS_UPDATER_PUBKEY }}
          MARDAS_UPDATE_ENDPOINT: https://github.com/mragetsars/Mardas-MD2PDF/releases/latest/download/latest.json
        run: |
          python scripts/build_native_desktop.py             --runtime "$RUNTIME_DIR"             --create-updater-artifacts             --updater-endpoint "$MARDAS_UPDATE_ENDPOINT"             --clean

      - name: Verify native packages
        shell: bash
        run: |
          version="${{ needs.build-core.outputs.version }}"
          count=0
          for artifact in build/desktop-native/Mardas-Studio-*; do
            test -f "$artifact" || continue
            case "$artifact" in
              *.dmg|*.AppImage|*.deb|*.AppImage.sig|*-updater.tar.gz|*-updater.tar.gz.sig)
                python scripts/verify_native_desktop.py "$artifact" --version "$version"
                count=$((count + 1))
                ;;
            esac
          done
          if ${{ matrix.linux }}; then
            test "$count" -ge 3
          else
            test "$count" -ge 3
          fi

      - name: Upload native packages
        uses: actions/upload-artifact@v7
        with:
          name: desktop-native-${{ matrix.label }}
          path: |
            build/desktop-native/Mardas-Studio-*.dmg
            build/desktop-native/Mardas-Studio-*.AppImage
            build/desktop-native/Mardas-Studio-*.AppImage.sig
            build/desktop-native/Mardas-Studio-*.deb
            build/desktop-native/Mardas-Studio-*-updater.tar.gz
            build/desktop-native/Mardas-Studio-*-updater.tar.gz.sig
            build/desktop-native/desktop-native-manifest.json
          if-no-files-found: error
          retention-days: 30

  attest:
    name: Finalize and attest release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build-core, offline-bundles, standalone-runtime, desktop-installer, unix-desktop-packages]
    if: github.repository == 'mragetsars/Mardas-MD2PDF'
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install release tooling dependencies
        run: python -m pip install --upgrade packaging

      - name: Download core artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-core
          path: build/release

      - name: Download offline bundles
        uses: actions/download-artifact@v8
        with:
          pattern: offline-*
          path: build/offline
          merge-multiple: true

      - name: Download standalone runtime
        uses: actions/download-artifact@v8
        with:
          name: standalone-runtime
          path: build/standalone

      - name: Download native desktop packages
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-native-*
          path: build/desktop-native
          merge-multiple: true

      - name: Finalize release manifest and checksums
        shell: bash
        run: |
          cp build/offline/*.zip build/release/
          cp build/standalone/*.zip build/release/
          find build/desktop-native -maxdepth 1 -type f -name 'Mardas-Studio-*' -exec cp {} build/release/ \;
          python scripts/extract_release_notes.py \
            --version "${{ needs.build-core.outputs.version }}" \
            --output build/RELEASE-NOTES.md
          python scripts/assemble_signed_updates.py \
            --artifact-dir build/release \
            --version "${{ needs.build-core.outputs.version }}" \
            --repository "$GITHUB_REPOSITORY" \
            --tag "v${{ needs.build-core.outputs.version }}" \
            --notes-file build/RELEASE-NOTES.md
          python scripts/finalize_release_artifacts.py \
            --artifact-dir build/release \
            --version "${{ needs.build-core.outputs.version }}" \
            --source-revision "$GITHUB_SHA" \
            --require-sbom \
            --minimum-bundle-count 3 \
            --minimum-standalone-runtime-count 1 \
            --minimum-desktop-installer-count 1 \
            --minimum-native-desktop-count 5 \
            --require-desktop-platform windows \
            --require-desktop-platform macos \
            --require-desktop-platform linux \
            --require-update-manifest
          python - <<'PY'
          from pathlib import Path
          source = Path("build/release/CHECKSUMS.sha256")
          selected = []
          for line in source.read_text(encoding="utf-8").splitlines():
              if not line:
                  continue
              name = line.split("  ", 1)[1]
              if name.endswith(".spdx.json") or name == "RELEASE-MANIFEST.json":
                  continue
              selected.append(line)
          Path("build/attestation-subjects.sha256").write_text(
              "\n".join(selected) + "\n", encoding="utf-8", newline="\n"
          )
          PY

      - name: Resolve SBOM path
        id: paths
        shell: bash
        run: |
          sbom="$(find build/release -maxdepth 1 -type f -name '*.spdx.json' -print -quit)"
          test -n "$sbom"
          echo "sbom=$sbom" >> "$GITHUB_OUTPUT"

      - name: Attest SLSA build provenance
        id: provenance
        uses: actions/attest@v4
        with:
          subject-checksums: build/attestation-subjects.sha256

      - name: Attest SPDX SBOM
        id: sbom
        uses: actions/attest@v4
        with:
          subject-checksums: build/attestation-subjects.sha256
          sbom-path: ${{ steps.paths.outputs.sbom }}

      - name: Preserve signed attestation bundles
        shell: bash
        run: |
          mkdir -p build/attestations
          cp "${{ steps.provenance.outputs.bundle-path }}" build/attestations/provenance.sigstore.json
          cp "${{ steps.sbom.outputs.bundle-path }}" build/attestations/sbom.sigstore.json
          (
            cd build/attestations
            sha256sum provenance.sigstore.json sbom.sigstore.json > CHECKSUMS.sha256
          )

      - name: Upload final release package
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ needs.build-core.outputs.version }}
          path: build/release/
          if-no-files-found: error
          retention-days: 90

      - name: Upload signed attestation bundles
        uses: actions/upload-artifact@v7
        with:
          name: release-attestations-${{ needs.build-core.outputs.version }}
          path: build/attestations/
          if-no-files-found: error
          retention-days: 90

  publish-draft:
    name: Stage draft GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build-core, attest]
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'mragetsars/Mardas-MD2PDF'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Download finalized release package
        uses: actions/download-artifact@v8
        with:
          name: release-${{ needs.build-core.outputs.version }}
          path: build/release

      - name: Verify tag and finalized release package
        shell: bash
        run: |
          version="${{ needs.build-core.outputs.version }}"
          test "$GITHUB_REF_NAME" = "v$version"
          python scripts/finalize_release_artifacts.py \
            --artifact-dir build/release \
            --version "$version" \
            --source-revision "$GITHUB_SHA" \
            --require-sbom \
            --minimum-bundle-count 3 \
            --minimum-standalone-runtime-count 1 \
            --minimum-desktop-installer-count 1 \
            --minimum-native-desktop-count 5 \
            --require-desktop-platform windows \
            --require-desktop-platform macos \
            --require-desktop-platform linux \
            --require-update-manifest \
            --verify-only
          python scripts/extract_release_notes.py \
            --version "$version" \
            --output build/RELEASE-NOTES.md

      - name: Create or refresh draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${{ needs.build-core.outputs.version }}"
          tag="v$version"
          title="Mardas Studio $version"
          if gh release view "$tag" --json isDraft >/tmp/mardas-release.json 2>/dev/null; then
            is_draft="$(python -c 'import json; print(str(json.load(open("/tmp/mardas-release.json"))["isDraft"]).lower())')"
            if [ "$is_draft" != "true" ]; then
              echo "Refusing to overwrite a published GitHub Release: $tag" >&2
              exit 1
            fi
            gh release edit "$tag" --draft --title "$title" --notes-file build/RELEASE-NOTES.md
            gh release upload "$tag" build/release/* --clobber
          else
            gh release create "$tag" build/release/* \
              --draft \
              --verify-tag \
              --title "$title" \
              --notes-file build/RELEASE-NOTES.md
          fi
          test "$(gh release view "$tag" --json isDraft --jq '.isDraft')" = "true"
