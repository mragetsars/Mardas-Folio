name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.10'
          - os: ubuntu-latest
            python-version: '3.11'
          - os: ubuntu-latest
            python-version: '3.12'
          - os: ubuntu-latest
            python-version: '3.13'
          - os: windows-latest
            python-version: '3.12'
          - os: windows-latest
            python-version: '3.13'
          - os: macos-latest
            python-version: '3.12'
          - os: macos-latest
            python-version: '3.13'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Ruff
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: python -m ruff check .

      - name: Run scoped type checks
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: bash scripts/check_types.sh

      - name: Enforce critical branch coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: bash scripts/check_critical_coverage.sh

      - name: Run tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          MARDAS_RENDER_SMOKE: '0'
        run: python -m pytest -q

      - name: Run CLI path smoke
        run: |
          python -m mardas_md2pdf.cli --version
          python -m mardas_md2pdf.sidecar --health
          python -m mardas_md2pdf.cli --list-styles

  dependency-audit:
    name: Runtime dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip

      - name: Install package and audit tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Audit installed dependencies
        run: bash scripts/security_audit.sh

      - name: Upload dependency audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-audit-${{ github.sha }}
          path: build/security/
          if-no-files-found: warn

  pypdf-compatibility:
    name: pypdf compatibility / ${{ matrix.pypdf }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        pypdf: ['4.0.0', 'latest']
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Select pypdf version
        shell: bash
        run: |
          if [[ "${{ matrix.pypdf }}" == "latest" ]]; then
            python -m pip install --upgrade pypdf
          else
            python -m pip install --force-reinstall "pypdf==${{ matrix.pypdf }}"
          fi
          python -c "import pypdf; print(pypdf.__version__)"

      - name: Run PDF compatibility tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          python -m pytest -q \
            tests/test_pdf_toc_destinations.py \
            tests/test_pdf_output.py \
            tests/test_pdf_accessibility_audit.py

  platform-wheel-smoke:
    name: Wheel render smoke / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    needs: core-tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Build and install wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build --wheel
          python -c "import glob,subprocess,sys; wheels=glob.glob('dist/*.whl'); assert len(wheels)==1; subprocess.check_call([sys.executable,'-m','pip','install','--force-reinstall',wheels[0]])"

      - name: Install Chromium dependencies
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium

      - name: Install Chromium
        if: runner.os != 'Linux'
        run: python -m playwright install chromium

      - name: Render Unicode-path smoke PDF
        run: python scripts/cross_platform_smoke.py --output build/platform-smoke/${{ runner.os }}.pdf

      - name: Upload platform smoke artifact
        uses: actions/upload-artifact@v7
        with:
          name: platform-smoke-${{ runner.os }}-${{ runner.arch }}
          path: build/platform-smoke/
          if-no-files-found: error

  visual-qa:
    name: Visual QA artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: platform-wheel-smoke
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install package, Chromium, and PDF rasterizer
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m playwright install --with-deps chromium

      - name: Build appearance visual artifacts
        run: |
          python scripts/audit_appearance_matrix.py \
            --output-dir build/visual-qa/appearance \
            --styles modern \
            --palettes blue \
            --modes light,dark \
            --render-png \
            --png-dpi 48 \
            --timeout 90 \
            --raster-timeout 60 \
            --fail-fast \
            --clean

      - name: Build feature visual artifacts
        run: |
          python scripts/audit_pdf_features.py \
            --output-dir build/visual-qa/features \
            --appearances modern:blue:light,modern:blue:dark \
            --render-png \
            --png-dpi 48 \
            --timeout 90 \
            --raster-timeout 60 \
            --fail-fast \
            --clean

      - name: Capture Studio visual artifact
        run: |
          python scripts/audit_studio_visual.py \
            --output-dir build/visual-qa/studio \
            --timeout 30 \
            --clean

      - name: Enforce semantic visual contracts
        run: |
          python scripts/check_visual_contracts.py \
            --appearance-manifest build/visual-qa/appearance/manifest.json \
            --features-manifest build/visual-qa/features/manifest.json \
            --studio-manifest build/visual-qa/studio/manifest.json \
            --output-dir build/visual-qa/contracts

      - name: Upload visual QA artifacts
        uses: actions/upload-artifact@v7
        with:
          name: visual-qa-${{ github.sha }}
          path: build/visual-qa/
          if-no-files-found: error

  windows-standalone-runtime:
    name: Windows standalone sidecar runtime
    runs-on: windows-latest
    timeout-minutes: 50
    needs: core-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install desktop build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[desktop]"

      - name: Install pinned Chromium headless shell
        run: python -m playwright install chromium --only-shell

      - name: Build portable standalone runtime
        run: python scripts/build_standalone_runtime.py --clean

      - name: Verify frozen runtime and Unicode rendering
        shell: pwsh
        run: |
          $runtime = Get-ChildItem build/standalone-runtime -Directory -Filter 'Mardas-MD2PDF-*-runtime-*' | Select-Object -First 1
          if (-not $runtime) { throw 'Standalone runtime directory was not created.' }
          python scripts/verify_standalone_runtime.py $runtime.FullName --render

      - name: Upload standalone runtime
        uses: actions/upload-artifact@v7
        with:
          name: standalone-runtime-Windows-${{ runner.arch }}
          path: build/standalone-runtime/*.zip
          if-no-files-found: error
          retention-days: 14

  desktop-contracts:
    name: Native desktop contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: core-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Build and verify dependency-free frontend
        run: |
          python scripts/build_desktop_frontend.py
          python scripts/verify_desktop_frontend.py apps/desktop/dist

      - name: Run desktop JavaScript contracts
        run: node --test apps/desktop/tests/*.test.mjs

      - name: Run desktop Python contracts
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: python -m pytest -q tests/test_desktop_app.py

  windows-desktop-installer:
    name: Windows native desktop installer
    runs-on: windows-latest
    timeout-minutes: 80
    needs: [windows-standalone-runtime, desktop-contracts]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Download standalone runtime
        uses: actions/download-artifact@v8
        with:
          name: standalone-runtime-Windows-X64
          path: build/runtime-download

      - name: Extract standalone runtime
        shell: pwsh
        run: |
          $zip = Get-ChildItem build/runtime-download -File -Filter '*.zip' | Select-Object -First 1
          if (-not $zip) { throw 'Standalone runtime archive was not downloaded.' }
          New-Item -ItemType Directory -Force build/runtime-extracted | Out-Null
          Expand-Archive -Path $zip.FullName -DestinationPath build/runtime-extracted -Force
          $runtime = Get-ChildItem build/runtime-extracted -Directory -Filter 'Mardas-MD2PDF-*-runtime-*' | Select-Object -First 1
          if (-not $runtime) { throw 'Standalone runtime directory was not found after extraction.' }
          "RUNTIME_DIR=$($runtime.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install desktop build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[desktop]"
          cargo install tauri-cli --version 2.11.4 --locked

      - name: Build native desktop installer
        shell: pwsh
        run: python scripts/build_desktop_app.py --runtime "$env:RUNTIME_DIR" --clean

      - name: Verify native desktop installer
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          $installer = Get-ChildItem build/desktop -File -Filter 'Mardas-Studio-*-setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Desktop installer was not created.' }
          python scripts/verify_desktop_installer.py $installer.FullName --version $version

      - name: Upload native desktop installer
        uses: actions/upload-artifact@v7
        with:
          name: desktop-installer-Windows-${{ runner.arch }}
          path: build/desktop/Mardas-Studio-*-setup.exe
          if-no-files-found: error
          retention-days: 14
