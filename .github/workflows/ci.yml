name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.10'
          - os: ubuntu-latest
            python-version: '3.11'
          - os: ubuntu-latest
            python-version: '3.12'
          - os: ubuntu-latest
            python-version: '3.13'
          - os: windows-latest
            python-version: '3.12'
          - os: windows-latest
            python-version: '3.13'
          - os: macos-latest
            python-version: '3.12'
          - os: macos-latest
            python-version: '3.13'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Ruff
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: python -m ruff check .

      - name: Run scoped type checks
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: bash scripts/check_types.sh

      - name: Enforce critical branch coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: bash scripts/check_critical_coverage.sh

      - name: Run tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          MARDAS_RENDER_SMOKE: '0'
        run: python -m pytest -q

      - name: Run CLI path smoke
        run: |
          python -m mardas_md2pdf.cli --version
          python -m mardas_md2pdf.sidecar --health
          python -m mardas_md2pdf.cli --list-styles

  dependency-audit:
    name: Runtime dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip

      - name: Install package and audit tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Audit installed dependencies
        run: bash scripts/security_audit.sh

      - name: Upload dependency audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-audit-${{ github.sha }}
          path: build/security/
          if-no-files-found: warn

  pypdf-compatibility:
    name: pypdf compatibility / ${{ matrix.pypdf }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The declared floor and the newest release. Pinning a version below
        # `pypdf>=6.15.0` tests a combination pip refuses to install, so it
        # measured nothing except how far the matrix had drifted from the
        # dependency floor raised for the pypdf security advisories.
        pypdf: ['6.15.0', 'latest']
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Select pypdf version
        shell: bash
        run: |
          if [[ "${{ matrix.pypdf }}" == "latest" ]]; then
            python -m pip install --upgrade pypdf
          else
            python -m pip install --force-reinstall "pypdf==${{ matrix.pypdf }}"
          fi
          python -c "import pypdf; print(pypdf.__version__)"

      - name: Run PDF compatibility tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          python -m pytest -q \
            tests/test_pdf_toc_destinations.py \
            tests/test_pdf_output.py \
            tests/test_pdf_accessibility_audit.py

  platform-wheel-smoke:
    name: Wheel render smoke / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    needs: core-tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Build and install wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build --wheel
          python -c "import glob,subprocess,sys; wheels=glob.glob('dist/*.whl'); assert len(wheels)==1; subprocess.check_call([sys.executable,'-m','pip','install','--force-reinstall',wheels[0]])"

      - name: Install Chromium dependencies
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium

      - name: Install Chromium
        if: runner.os != 'Linux'
        run: python -m playwright install chromium

      - name: Render Unicode-path smoke PDF
        run: python scripts/cross_platform_smoke.py --output build/platform-smoke/${{ runner.os }}.pdf

      - name: Upload platform smoke artifact
        uses: actions/upload-artifact@v7
        with:
          name: platform-smoke-${{ runner.os }}-${{ runner.arch }}
          path: build/platform-smoke/
          if-no-files-found: error

  visual-qa:
    name: Visual QA artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: platform-wheel-smoke
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install package, Chromium, and PDF rasterizer
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m playwright install --with-deps chromium

      - name: Build appearance visual artifacts
        run: |
          python scripts/audit_appearance_matrix.py \
            --output-dir build/visual-qa/appearance \
            --styles modern \
            --palettes blue \
            --modes light,dark \
            --render-png \
            --png-dpi 48 \
            --timeout 90 \
            --raster-timeout 60 \
            --fail-fast \
            --clean

      - name: Build feature visual artifacts
        run: |
          python scripts/audit_pdf_features.py \
            --output-dir build/visual-qa/features \
            --appearances modern:blue:light,modern:blue:dark \
            --render-png \
            --png-dpi 48 \
            --timeout 90 \
            --raster-timeout 60 \
            --fail-fast \
            --clean

      - name: Capture Studio visual artifact
        run: |
          python scripts/audit_studio_visual.py \
            --output-dir build/visual-qa/studio \
            --timeout 30 \
            --clean

      - name: Enforce semantic visual contracts
        run: |
          python scripts/check_visual_contracts.py \
            --appearance-manifest build/visual-qa/appearance/manifest.json \
            --features-manifest build/visual-qa/features/manifest.json \
            --studio-manifest build/visual-qa/studio/manifest.json \
            --output-dir build/visual-qa/contracts

      - name: Upload visual QA artifacts
        uses: actions/upload-artifact@v7
        with:
          name: visual-qa-${{ github.sha }}
          path: build/visual-qa/
          if-no-files-found: error

  windows-standalone-runtime:
    name: Windows standalone sidecar runtime
    runs-on: windows-latest
    timeout-minutes: 50
    needs: core-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install desktop build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[desktop]"

      - name: Install pinned Chromium headless shell
        run: python -m playwright install chromium --only-shell

      - name: Build portable standalone runtime
        run: python scripts/build_standalone_runtime.py --clean

      - name: Verify frozen runtime and Unicode rendering
        shell: pwsh
        run: |
          $runtime = Get-ChildItem build/standalone-runtime -Directory -Filter 'Mardas-Folio-*-runtime-*' | Select-Object -First 1
          if (-not $runtime) { throw 'Standalone runtime directory was not created.' }
          python scripts/verify_standalone_runtime.py $runtime.FullName --render

      - name: Upload standalone runtime
        uses: actions/upload-artifact@v7
        with:
          name: standalone-runtime-Windows-${{ runner.arch }}
          path: build/standalone-runtime/*.zip
          if-no-files-found: error
          retention-days: 14

  desktop-contracts:
    name: Native desktop contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: core-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Install locked desktop editor dependencies
        run: npm --prefix apps/desktop ci --no-audit --no-fund

      # The core-tests matrix skips this suite because it never installs the
      # editor's dependencies; this is the job that actually runs it.
      - name: Run desktop interface suite
        run: npm --prefix apps/desktop test

      - name: Build and verify offline frontend
        run: |
          npm --prefix apps/desktop run check:editor
          python scripts/build_desktop_frontend.py
          python scripts/verify_desktop_frontend.py apps/desktop/dist
          python scripts/audit_desktop_accessibility.py --output-dir build/desktop-accessibility

      - name: Install desktop UI smoke browser
        run: python -m playwright install --with-deps chromium

      - name: Run browser-backed desktop UI smoke
        run: python scripts/audit_desktop_ui.py --output-dir build/desktop-ui-audit

      - name: Upload desktop UX audit evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-ux-audit
          path: |
            build/desktop-accessibility/
            build/desktop-ui-audit/
          if-no-files-found: warn
          retention-days: 14

      - name: Run desktop JavaScript contracts
        run: node --test apps/desktop/tests/*.test.mjs

      - name: Run desktop Python contracts
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: python -m pytest -q tests/test_desktop_app.py

  windows-desktop-installer:
    name: Windows native desktop installer
    runs-on: windows-latest
    timeout-minutes: 80
    needs: [windows-standalone-runtime, desktop-contracts]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.100.0

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Download standalone runtime
        uses: actions/download-artifact@v8
        with:
          name: standalone-runtime-Windows-X64
          path: build/runtime-download

      - name: Extract standalone runtime
        shell: pwsh
        run: |
          $zip = Get-ChildItem build/runtime-download -File -Filter '*.zip' | Select-Object -First 1
          if (-not $zip) { throw 'Standalone runtime archive was not downloaded.' }
          New-Item -ItemType Directory -Force build/runtime-extracted | Out-Null
          Expand-Archive -Path $zip.FullName -DestinationPath build/runtime-extracted -Force
          $runtime = Get-ChildItem build/runtime-extracted -Directory -Filter 'Mardas-Folio-*-runtime-*' | Select-Object -First 1
          if (-not $runtime) { throw 'Standalone runtime directory was not found after extraction.' }
          "RUNTIME_DIR=$($runtime.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install desktop build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[desktop]"
          cargo install tauri-cli --version 2.11.4 --locked

      - name: Run locked Rust tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked

      - name: Build native Windows packages
        shell: pwsh
        run: python scripts/build_native_desktop.py --runtime "$env:RUNTIME_DIR" --clean

      - name: Verify native Windows packages
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          $artifacts = Get-ChildItem build/desktop-native -File | Where-Object { $_.Name -match '^Mardas-Folio-.*\.(exe|zip)$' }
          if (-not $artifacts) { throw 'Native Windows desktop artifacts were not created.' }
          foreach ($artifact in $artifacts) {
            python scripts/verify_native_desktop.py $artifact.FullName --version $version
          }

      - name: Upload native Windows packages
        uses: actions/upload-artifact@v7
        with:
          name: desktop-native-Windows-${{ runner.arch }}
          path: |
            build/desktop-native/Mardas-Folio-*
            build/desktop-native/desktop-native-manifest.json
          if-no-files-found: error
          retention-days: 14

  unix-desktop-packages:
    name: Native desktop / ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    needs: [core-tests, desktop-contracts]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: Linux-X64
          - os: macos-15
            label: macOS-ARM64
          - os: macos-15-intel
            label: macOS-X64
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.100.0

      - name: Install Tauri Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install desktop build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[desktop]"
          cargo install tauri-cli --version 2.11.4 --locked

      - name: Run locked Rust tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked

      - name: Install Chromium runtime
        if: runner.os != 'Linux'
        run: python -m playwright install chromium --only-shell

      - name: Install Chromium runtime and Linux browser dependencies
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium --only-shell

      - name: Build standalone runtime
        run: python scripts/build_standalone_runtime.py --clean

      - name: Resolve and verify standalone runtime
        shell: bash
        run: |
          runtime="$(find build/standalone-runtime -maxdepth 1 -type d -name 'Mardas-Folio-*-runtime-*' -print -quit)"
          test -n "$runtime"
          python scripts/verify_standalone_runtime.py "$runtime" --render
          printf 'RUNTIME_DIR=%s\n' "$runtime" >> "$GITHUB_ENV"

      - name: Build native desktop packages
        shell: bash
        run: python scripts/build_native_desktop.py --runtime "$RUNTIME_DIR" --clean

      - name: Verify native desktop packages
        shell: bash
        run: |
          version="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          found=0
          while IFS= read -r -d '' artifact; do
            python scripts/verify_native_desktop.py "$artifact" --version "$version"
            found=$((found + 1))
          done < <(find build/desktop-native -maxdepth 1 -type f \
            \( -name 'Mardas-Folio-*.dmg' -o -name 'Mardas-Folio-*.AppImage' -o -name 'Mardas-Folio-*.deb' \) -print0)
          test "$found" -gt 0

      - name: Upload native desktop packages
        uses: actions/upload-artifact@v7
        with:
          name: desktop-native-${{ matrix.label }}
          path: |
            build/desktop-native/Mardas-Folio-*
            build/desktop-native/desktop-native-manifest.json
          if-no-files-found: error
          retention-days: 14
