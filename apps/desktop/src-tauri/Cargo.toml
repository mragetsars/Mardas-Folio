[package]
name = "mardas-studio"
version = "1.29.0"
description = "Native desktop shell for the Mardas MD2PDF publishing engine"
authors = ["mragetsars <mragetsars@gmail.com>"]
license = "MIT"
repository = "https://github.com/mragetsars/Mardas-MD2PDF"
edition = "2021"
rust-version = "1.77.2"

[[bin]]
name = "mardas-studio"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "=2.10.1"
url = "2"
