[package]
name = "mardas-folio"
version = "2.0.3"
description = "Native desktop shell for the Mardas Folio publishing engine"
authors = ["mragetsars <mragetsars@gmail.com>"]
license = "MIT"
repository = "https://github.com/mragetsars/Mardas-Folio"
edition = "2021"
rust-version = "1.97.1"

[[bin]]
name = "mardas-folio"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
# Release artifacts use raw NSIS/AppImage payloads and macOS .app.tar.gz.
# The optional legacy Windows ZIP extractor is unused and vulnerable upstream.
tauri-plugin-updater = { version = "=2.14.0", default-features = false, features = ["rustls-tls", "system-proxy"] }
url = "2"
