[build-system]
requires = ["setuptools==83.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mardas-folio"
version = "2.0.2"
description = "Mardas Folio: Persian/English Markdown publishing with RTL/LTR typography, deterministic multi-file books, MathJax, diagrams, a desktop authoring workspace, and PDF navigation."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "mragetsars", email = "mragetsars@gmail.com" }
]
keywords = ["markdown", "pdf", "gfm", "github", "rtl", "persian", "mathjax", "mermaid", "pygments", "playwright", "gui"]
dependencies = [
  "markdown-it-py>=3.0.0",
  "pygments>=2.17.0",
  "beautifulsoup4>=4.12.0",
  "soupsieve>=2.8.4",
  "playwright>=1.45.0",
  "PyYAML>=6.0.0",
  "pypdf>=6.15.0",
  "tomli>=2.0.1; python_version < '3.11'"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "coverage[toml]>=7.6.0",
  "ruff>=0.6.0",
  "pyright>=1.1.390",
  "pip-audit>=2.7.0",
  "build>=1.2.0",
  "packaging>=24.0",
  "setuptools==83.0.0",
  "wheel==0.47.0"
]
desktop = [
  "pyinstaller>=6.11,<7"
]

[project.scripts]
folio = "mardas_folio.cli:main"
folio-gui = "mardas_folio.gui:main"
folio-sidecar = "mardas_folio.sidecar:main"

[tool.setuptools]
packages = ["mardas_folio", "mardas_folio.assets", "mardas_folio.assets.mathjax"]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.package-data]
mardas_folio = [
  "assets/*.css",
  "assets/*.png",
  "assets/*.svg",
  "assets/*.html",
  "assets/mathjax/*"
]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
# Keep the CI contract explicit so a future Ruff release cannot silently
# broaden the enabled rule set and break otherwise unchanged release builds.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["mardas_folio"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]
